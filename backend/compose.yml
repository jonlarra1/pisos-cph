services:
  pisos-api:
    build: .
    container_name: pisos-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"      # API: only reachable from the Pi itself; Tailscale Funnel publishes it
      - "127.0.0.1:8790:8790"      # private status panel: published only inside the tailnet (tailscale serve, NOT funnel)
    user: "10002:10002"            # usuario propio; el buzón le da escritura por grupo (2775, grupo 10002)
    volumes:
      - ./data:/data
      - /home/jon/syncthing_media/jon_Vault/Jon/Vivienda/pisos-bridge:/bridge
    environment:
      ALLOWED_ORIGINS: "https://jonlarra1.github.io,http://localhost:8000"
      API_KEY: "${API_KEY}"
      ADMIN_USERS: "larrabajojon@"    # Tailscale login(s) allowed to open the status panel
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 100
    networks: [pisosnet]
    logging:                      # stdout de Docker con tope (el detalle va a data/logs, con su propia rotación)
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  pisosnet:                       # red fija: el cortafuegos (pisos-firewall) bloquea su salida a LAN/Tailscale/la Pi
    driver: bridge
    driver_opts: {com.docker.network.bridge.name: br-pisos}
    ipam: {config: [{subnet: 172.31.250.0/24}]}
